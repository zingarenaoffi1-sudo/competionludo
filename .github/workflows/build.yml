name: Build ZingArena Ludo APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ''

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android Keystore from Secrets
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Keystore secret found. Decoding original keystore..."
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          else
            echo "Keystore secret not found. Generating debug keystore as fallback..."
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ZingArena Ludo,O=ZingArena,C=IN"
          fi
          
          echo "========================================================="
          echo "Keystore SHA-1 / SHA-256 Fingerprints:"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true
          echo "========================================================="
          
          cp ~/.android/debug.keystore ./debug.keystore

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Debug-Keystore
          path: debug.keystore

      - name: Prepare Web Assets for Capacitor
        run: |
          rm -rf www
          mkdir -p www
          rsync -a \
            --exclude='www' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android' \
            --exclude='debug.keystore' \
            --exclude='icon_old.png' \
            --exclude='icon_new.svg' \
            ./ ./www/
          echo "Web directory prepared successfully."

      - name: Install Capacitor & Mobile Dependencies
        run: |
          npm install --save-dev @capacitor/cli@^6.0.0 @capacitor/assets@^3.0.0
          npm install --save @capacitor/core@^6.0.0 @capacitor/android@^6.0.0 @capacitor-community/admob@^6.0.0 firebase @capacitor-firebase/authentication@^6.0.0

      - name: Initialize Capacitor Android Project
        env:
          SECRET_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          rm -rf android
          npx cap add android

          # Detect AdMob App ID
          CONFIG_APP_ID=$(grep -o "appId: *['\"][^'\"]*['\"]" admob-config.js | sed -E "s/appId: *['\"]([^'\"]*)['\"]/\1/" || echo "")
          FINAL_ADMOB_ID="${SECRET_ADMOB_APP_ID:-$CONFIG_APP_ID}"
          if [ -z "$FINAL_ADMOB_ID" ]; then
            FINAL_ADMOB_ID="ca-app-pub-3940256099942544~3347511713"
          fi
          echo "Applying AdMob App ID: $FINAL_ADMOB_ID"

          # Update AndroidManifest using Python
          python3 -c "
          import re, os
          path = 'android/app/src/main/AndroidManifest.xml'
          app_id = os.environ.get('FINAL_ADMOB_ID', 'ca-app-pub-3940256099942544~3347511713')
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          if 'com.google.android.gms.ads.APPLICATION_ID' not in content:
              meta = f'    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"{app_id}\"/>\n    </application>'
              content = content.replace('</application>', meta)
          perms = ['INTERNET', 'ACCESS_NETWORK_STATE', 'RECORD_AUDIO', 'MODIFY_AUDIO_SETTINGS']
          for p in perms:
              perm_str = f'android.permission.{p}'
              if perm_str not in content:
                  content = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name=\"' + perm_str + '\"/>', content)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('AndroidManifest.xml successfully updated.')
          "

          # Generate app icons if icon.png is present
          if [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx capacitor-assets generate --android || echo "Icon generation finished."
          fi

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Inject Google Services Configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 -c "
          import os, json
          target = 'android/app/google-services.json'
          secret = os.environ.get('GOOGLE_SERVICES_JSON', '').strip()
          if len(secret) > 20:
              with open(target, 'w', encoding='utf-8') as f:
                  f.write(secret)
              print('Injected google-services.json from GitHub Secrets.')
          else:
              print('Using fallback google-services.json...')
              fallback = {
                  'project_info': {
                      'project_number': '100000000000',
                      'project_id': 'zingarena-ludo',
                      'storage_bucket': 'zingarena-ludo.appspot.com'
                  },
                  'client': [
                      {
                          'client_info': {
                              'mobilesdk_app_id': '1:100000000000:android:abcdef123456',
                              'android_client_info': {
                                  'package_name': 'com.zingarena.app'
                              }
                          },
                          'oauth_client': [],
                          'api_key': [{'current_key': 'dummy_api_key_for_build'}],
                          'services': {}
                      }
                  ],
                  'configuration_version': '1'
              }
              with open(target, 'w', encoding='utf-8') as f:
                  json.dump(fallback, f, indent=2)
          "

      - name: Configure Gradle & Plugins
        run: |
          # Copy keystore (from user secrets) into android/app directory
          cp ~/.android/debug.keystore android/app/debug.keystore
          
          cd android
          chmod +x gradlew
          
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=false" >> gradle.properties
          
          python3 -c "
          # 1. Root build.gradle
          with open('build.gradle', 'r', encoding='utf-8') as f:
              root = f.read()
          if 'com.google.gms:google-services' not in root:
              root = root.replace('dependencies {', 'dependencies {\n        classpath \"com.google.gms:google-services:4.4.2\"')
          if 'org.jetbrains.kotlin:kotlin-stdlib' not in root:
              root += '\nallprojects { configurations.all { resolutionStrategy { force \"org.jetbrains.kotlin:kotlin-stdlib:1.9.24\"; force \"org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24\"; force \"org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24\" } } }\n'
          with open('build.gradle', 'w', encoding='utf-8') as f:
              f.write(root)

          # 2. App build.gradle
          with open('app/build.gradle', 'r', encoding='utf-8') as f:
              app = f.read()
          if 'com.google.gms.google-services' not in app:
              app += '\napply plugin: \"com.google.gms.google-services\"\n'
          if 'signingConfigs.debug' not in app:
              signing_block = '''
  android {
      signingConfigs {
          debug {
              storeFile file(\"debug.keystore\")
              storePassword \"android\"
              keyAlias \"androiddebugkey\"
              keyPassword \"android\"
          }
      }
      buildTypes {
          debug {
              signingConfig signingConfigs.debug
          }
      }
  }
  '''
              app += signing_block
          with open('app/build.gradle', 'w', encoding='utf-8') as f:
              f.write(app)
          print('Gradle configuration applied successfully.')
          "

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Upload ZingArena Ludo APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZingArena-Ludo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
