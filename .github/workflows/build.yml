name: Build ZingArena APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 🚀 🔥 FINGERPRINT KO ZINDAGI BHAR SAME RAKHNE WALA MAGIC 🔥 🚀
      - name: Setup Permanent Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          
          # 1. Check if the secret exists in GitHub Secrets (Base64 decode karega)
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "✅ GitHub Secrets se Keystore mil gayi! Decoding and using SAME FINGERPRINT forever."
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          
          # 2. Agar secret nahi mila, toh nayi banayega
          else
            echo "⚠️ Secret nahi mila, nayi Keystore bana rahe hain..."
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          echo "========================================================="
          echo "🔥🔥🔥 COPY THIS SHA-1 FINGERPRINT 🔥🔥🔥"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"
          echo "========================================================="
          
          # Isko bahar copy kar rahe hain taaki tu isko download kar sake
          cp ~/.android/debug.keystore ./debug.keystore

      # 💾 Keystore ko download karne ke liye Artifact banayenge
      - name: Upload Keystore for Permanent Save
        uses: actions/upload-artifact@v4
        with:
          name: Download-This-Keystore
          path: debug.keystore

      - name: Prepare www
        run: |
          rm -rf www
          mkdir -p www
          rsync -a \
            --exclude='www' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android' \
            --exclude='debug.keystore' \
            ./ ./www/

      - name: Install Capacitor Android, Logo, AdMob & Firebase
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npm install @capacitor-community/admob
          npm install firebase @capacitor-firebase/authentication
          
          npx cap init "ZingArena" "com.zingarena.app" --web-dir www
          
          rm -f capacitor.config.ts
          
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.zingarena.app",
            "appName": "ZingArena",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "FirebaseAuthentication": {
                "skipNativeAuth": false,
                "providers": ["google.com"]
              }
            }
          }
          EOF
          
          npx cap add android
          
          mkdir -p assets
          cp icon.png assets/icon.png
          npx capacitor-assets generate --android

          sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>|' android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Inject Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "Firebase JSON successfully injected!"

      - name: Configure Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.9
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=false" >> gradle.properties
          
          if ! grep -q "gms:google-services" build.gradle; then
            sed -i '/dependencies {/a \        classpath '\''com.google.gms:google-services:4.4.2'\''' build.gradle
          fi

          echo "apply plugin: 'com.google.gms.google-services'" >> app/build.gradle
          
          cat <<EOF >> build.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZingArena-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
