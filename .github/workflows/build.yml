name: Build Ludo APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ''

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android Keystore from Secrets
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Keystore secret found. Decoding original keystore..."
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          else
            echo "Keystore secret not found. Generating debug keystore as fallback..."
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ludo,O=Ludo,C=IN"
          fi
          
          echo "========================================================="
          echo "Keystore SHA-1 / SHA-256 Fingerprints:"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true
          echo "========================================================="
          
          cp ~/.android/debug.keystore ./debug.keystore

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Debug-Keystore
          path: debug.keystore

      - name: Prepare Web Assets for Capacitor
        run: |
          rm -rf www
          mkdir -p www
          rsync -a \
            --exclude='www' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android' \
            --exclude='debug.keystore' \
            ./ ./www/
          echo "Web directory prepared successfully."

      - name: Install Capacitor & Mobile Dependencies
        run: |
          npm install --save-dev @capacitor/cli@^6.0.0
          npm install --save @capacitor/core@^6.0.0 @capacitor/android@^6.0.0 @capacitor-community/admob@^6.0.0

      - name: Initialize Capacitor Android Project
        env:
          SECRET_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          rm -rf android
          npx cap add android

          # Detect AdMob App ID
          CONFIG_APP_ID=$(grep -o "appId: *['\"][^'\"]*['\"]" admob-config.js | sed -E "s/appId: *['\"]([^'\"]*)['\"]/\1/" || echo "")
          FINAL_ADMOB_ID="${SECRET_ADMOB_APP_ID:-$CONFIG_APP_ID}"
          if [ -z "$FINAL_ADMOB_ID" ]; then
            FINAL_ADMOB_ID="ca-app-pub-3940256099942544~3347511713"
          fi
          echo "Applying AdMob App ID: $FINAL_ADMOB_ID"

          # Update AndroidManifest and app name strings
          python3 -c '
          import os, re
          
          # 1. AndroidManifest.xml
          path = "android/app/src/main/AndroidManifest.xml"
          app_id = os.environ.get("FINAL_ADMOB_ID", "ca-app-pub-3940256099942544~3347511713")
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          admob_meta = "\n        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"" + app_id + "\"/>\n    </application>"
          if "com.google.android.gms.ads.APPLICATION_ID" not in content:
              content = content.replace("</application>", admob_meta)

          perms = "\n    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>\n    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\"/>\n    <application"
          if "android.permission.RECORD_AUDIO" not in content:
              content = content.replace("<application", perms)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          # 2. App Name strings.xml -> Set app display name to "Ludo"
          strings_path = "android/app/src/main/res/values/strings.xml"
          if os.path.exists(strings_path):
              with open(strings_path, "r", encoding="utf-8") as f:
                  strings_xml = f.read()
              strings_xml = re.sub(r"<string name=\"app_name\">[^<]*</string>", "<string name=\"app_name\">Ludo</string>", strings_xml)
              strings_xml = re.sub(r"<string name=\"title_activity_main\">[^<]*</string>", "<string name=\"title_activity_main\">Ludo</string>", strings_xml)
              with open(strings_path, "w", encoding="utf-8") as f:
                  f.write(strings_xml)

          print("AndroidManifest.xml and strings.xml updated successfully.")
          '

      - name: Generate High-Res Android App Icons
        run: |
          if [ -f icon.png ]; then
            echo "Generating high-resolution launcher icons for all Android densities..."
            densities="mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432"
            for item in $densities; do
              dir=$(echo $item | cut -d: -f1)
              size=$(echo $item | cut -d: -f2)
              fg_size=$(echo $item | cut -d: -f3)
              target_dir="android/app/src/main/res/mipmap-$dir"
              mkdir -p "$target_dir"
              convert icon.png -resize "${size}x${size}" "$target_dir/ic_launcher.png"
              convert icon.png -resize "${size}x${size}" "$target_dir/ic_launcher_round.png"
              convert icon.png -resize "${fg_size}x${fg_size}" "$target_dir/ic_launcher_foreground.png"
            done

            mkdir -p android/app/src/main/res/values
            echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#0b0f19</color></resources>' > android/app/src/main/res/values/ic_launcher_background.xml
            echo "Custom Ludo icons generated across all mipmap folders!"
          else
            echo "icon.png not found, skipping icon generation."
          fi

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Configure Gradle & Plugins
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cp ~/.android/debug.keystore android/app/debug.keystore
          
          cd android
          chmod +x gradlew
          
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=false" >> gradle.properties
          
          SECRET_CONTENT="${GOOGLE_SERVICES_JSON:-}"
          HAS_REAL_FIREBASE=false
          if [ ${#SECRET_CONTENT} -gt 100 ]; then
            if echo "$SECRET_CONTENT" | grep -q "project_id" && echo "$SECRET_CONTENT" | grep -q "client"; then
              echo "$SECRET_CONTENT" > app/google-services.json
              HAS_REAL_FIREBASE=true
              echo "Real google-services.json found and written!"
            fi
          fi

          python3 -c '
          import os

          # 1. Root build.gradle
          with open("build.gradle", "r", encoding="utf-8") as f:
              root = f.read()

          has_fb = os.environ.get("HAS_REAL_FIREBASE", "false") == "true"
          if has_fb and "com.google.gms:google-services" not in root:
              root = root.replace("dependencies {", "dependencies {\n        classpath \"com.google.gms:google-services:4.4.2\"")

          if "org.jetbrains.kotlin:kotlin-stdlib" not in root:
              root += "\nallprojects { configurations.all { resolutionStrategy { force \"org.jetbrains.kotlin:kotlin-stdlib:1.9.24\"; force \"org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24\"; force \"org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24\" } } }\n"

          with open("build.gradle", "w", encoding="utf-8") as f:
              f.write(root)

          # 2. App build.gradle
          with open("app/build.gradle", "r", encoding="utf-8") as f:
              app = f.read()

          if has_fb and "com.google.gms.google-services" not in app:
              app += "\napply plugin: \"com.google.gms.google-services\"\n"

          if "signingConfigs.debug" not in app:
              signing_cfg = "\nandroid {\n    signingConfigs {\n        debug {\n            storeFile file(\"debug.keystore\")\n            storePassword \"android\"\n            keyAlias \"androiddebugkey\"\n            keyPassword \"android\"\n        }\n    }\n    buildTypes {\n        debug {\n            signingConfig signingConfigs.debug\n        }\n    }\n}\n"
              app += signing_cfg

          with open("app/build.gradle", "w", encoding="utf-8") as f:
              f.write(app)

          print("Gradle configuration applied. Firebase active:", has_fb)
          '

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Upload Ludo APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
