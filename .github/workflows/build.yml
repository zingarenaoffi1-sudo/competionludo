name: Build ZingArena Ludo APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ''

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Keystore found in GitHub Secrets. Decoding and applying..."
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          else
            echo "Keystore secret not found. Generating a new debug keystore..."
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ZingArena Ludo,O=ZingArena,C=IN"
          fi
          
          echo "========================================================="
          echo "SHA-1 and SHA-256 Fingerprints (for Firebase / Google Login):"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"
          echo "========================================================="
          
          cp ~/.android/debug.keystore ./debug.keystore

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Debug-Keystore
          path: debug.keystore

      - name: Prepare Web Assets for Capacitor
        run: |
          rm -rf www
          mkdir -p www
          rsync -a \
            --exclude='www' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android' \
            --exclude='debug.keystore' \
            ./ ./www/
          echo "Web directory prepared successfully."

      - name: Install Capacitor & Mobile Dependencies
        run: |
          npm install --save-dev @capacitor/cli@^6.0.0 @capacitor/assets@^3.0.0
          npm install --save @capacitor/core@^6.0.0 @capacitor/android@^6.0.0 @capacitor-community/admob@^6.0.0 firebase @capacitor-firebase/authentication@^6.0.0

      - name: Initialize Capacitor Android Project
        env:
          SECRET_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          # Copy or verify capacitor.config.json
          if [ ! -f capacitor.config.json ]; then
            cat <<EOF > capacitor.config.json
            {
              "appId": "com.zingarena.app",
              "appName": "ZingArena Ludo",
              "webDir": "www",
              "bundledWebRuntime": false,
              "plugins": {
                "FirebaseAuthentication": {
                  "skipNativeAuth": false,
                  "providers": ["google.com"]
                }
              }
            }
            EOF
          fi
          
          rm -rf android
          npx cap add android

          # Detect AdMob App ID from secrets or admob-config.js
          CONFIG_APP_ID=$(grep -o "appId: *['\"][^'\"]*['\"]" admob-config.js | sed -E "s/appId: *['\"]([^'\"]*)['\"]/\1/" || echo "")
          FINAL_ADMOB_ID="${SECRET_ADMOB_APP_ID:-$CONFIG_APP_ID}"
          if [ -z "$FINAL_ADMOB_ID" ]; then
            FINAL_ADMOB_ID="ca-app-pub-3940256099942544~3347511713"
          fi
          echo "Applying AdMob App ID: $FINAL_ADMOB_ID"

          # Inject AdMob App ID into AndroidManifest.xml
          sed -i "s|</application>|    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$FINAL_ADMOB_ID\"/>\n    </application>|" android/app/src/main/AndroidManifest.xml

          # Inject permissions for Audio/Voice and Internet
          sed -i 's|<manifest.*>|&\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>|' android/app/src/main/AndroidManifest.xml

          # Generate app icons if icon.png is present
          if [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx capacitor-assets generate --android || echo "Icon generation skipped or completed."
          fi

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Inject Google Services Configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ] && [ "$GOOGLE_SERVICES_JSON" != "null" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json from GitHub Secrets injected."
          else
            echo "GOOGLE_SERVICES_JSON secret not provided. Creating valid fallback google-services.json to ensure build passes..."
            cat <<EOF > android/app/google-services.json
            {
              "project_info": {
                "project_number": "100000000000",
                "project_id": "zingarena-ludo",
                "storage_bucket": "zingarena-ludo.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:100000000000:android:abcdef123456",
                    "android_client_info": {
                      "package_name": "com.zingarena.app"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "dummy_api_key_for_build"
                    }
                  ],
                  "services": {}
                }
              ],
              "configuration_version": "1"
            }
            EOF
          fi

      - name: Configure Gradle & Plugins
        run: |
          cp ~/.android/debug.keystore android/app/debug.keystore
          
          cd android
          chmod +x gradlew
          
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=false" >> gradle.properties
          
          # Add google-services classpath if not already present
          if ! grep -q "gms:google-services" build.gradle; then
            sed -i '/dependencies {/a \        classpath '\''com.google.gms:google-services:4.4.2'\''' build.gradle
          fi

          # Apply google-services in app/build.gradle
          if ! grep -q "com.google.gms.google-services" app/build.gradle; then
            echo "apply plugin: 'com.google.gms.google-services'" >> app/build.gradle
          fi
          
          cat <<EOF >> app/build.gradle

          android {
              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF
          
          cat <<EOF >> build.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
                  }
              }
          }
          EOF

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Upload ZingArena Ludo APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZingArena-Ludo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
