name: Build Ludo APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Keystore found in GitHub Secrets. Decoding and applying..."
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          else
            echo "Keystore secret not found. Generating a new debug keystore..."
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          echo "========================================================="
          echo "SHA-1 and SHA-256 Fingerprints:"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"
          echo "========================================================="
          
          cp ~/.android/debug.keystore ./debug.keystore

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Debug-Keystore
          path: debug.keystore

      - name: Prepare Web Directory
        run: |
          rm -rf www
          mkdir -p www
          rsync -a \
            --exclude='www' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android' \
            --exclude='debug.keystore' \
            ./ ./www/

      - name: Install Dependencies and Initialize Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npm install @capacitor-community/admob
          npm install firebase @capacitor-firebase/authentication
          
          npx cap init "Ludo" "com.zingarena.app" --web-dir www
          
          rm -f capacitor.config.ts
          
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.zingarena.app",
            "appName": "Ludo",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "FirebaseAuthentication": {
                "skipNativeAuth": false,
                "providers": ["google.com"]
              }
            }
          }
          EOF
          
          npx cap add android
          
          mkdir -p assets
          if [ -f icon.png ]; then
            cp icon.png assets/icon.png
            npx capacitor-assets generate --android
          fi

          sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>|' android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android

      - name: Inject Google Services Configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "google-services.json successfully injected."

      - name: Configure Gradle Build Settings
        run: |
          cp ~/.android/debug.keystore android/app/debug.keystore
          
          cd android
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.9
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=false" >> gradle.properties
          
          if ! grep -q "gms:google-services" build.gradle; then
            sed -i '/dependencies {/a \        classpath '\''com.google.gms:google-services:4.4.2'\''' build.gradle
          fi

          echo "apply plugin: 'com.google.gms.google-services'" >> app/build.gradle
          
          cat <<EOF >> app/build.gradle
          
          android {
              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF
          
          cat <<EOF >> build.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
