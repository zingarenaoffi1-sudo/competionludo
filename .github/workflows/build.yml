name: Build ZingArena Ludo APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ''

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ZingArena Ludo,O=ZingArena,C=IN"
          fi
          cp ~/.android/debug.keystore ./debug.keystore

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Debug-Keystore
          path: debug.keystore

      - name: Prepare Web Assets for Capacitor
        run: |
          rm -rf www
          mkdir -p www
          rsync -a \
            --exclude='www' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android' \
            --exclude='debug.keystore' \
            ./ ./www/
          echo "Web directory prepared."

      - name: Install Capacitor & Mobile Dependencies
        run: |
          npm install --save-dev @capacitor/cli@^6.0.0 @capacitor/assets@^3.0.0
          npm install --save @capacitor/core@^6.0.0 @capacitor/android@^6.0.0 @capacitor-community/admob@^6.0.0 firebase @capacitor-firebase/authentication@^6.0.0

      - name: Initialize Capacitor Android Project
        env:
          SECRET_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          rm -rf android
          npx cap add android

          # Update AndroidManifest with AdMob App ID and Permissions using Node
          node -e '
          const fs = require("fs");
          const manifestPath = "android/app/src/main/AndroidManifest.xml";
          let xml = fs.readFileSync(manifestPath, "utf8");
          
          let appId = process.env.SECRET_ADMOB_APP_ID;
          if (!appId || !appId.trim()) {
            try {
              const cfg = fs.readFileSync("admob-config.js", "utf8");
              const m = cfg.match(/appId:\s*[\x27\x22]([^\x27\x22]+)[\x27\x22]/);
              if (m) appId = m[1];
            } catch(e) {}
          }
          if (!appId || !appId.trim()) {
            appId = "ca-app-pub-3940256099942544~3347511713";
          }
          console.log("Configuring AdMob App ID:", appId);
          
          if (!xml.includes("com.google.android.gms.ads.APPLICATION_ID")) {
            xml = xml.replace("</application>", `    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="${appId}"/>\n    </application>`);
          }
          
          const permissions = [
            "android.permission.INTERNET",
            "android.permission.ACCESS_NETWORK_STATE",
            "android.permission.RECORD_AUDIO",
            "android.permission.MODIFY_AUDIO_SETTINGS"
          ];
          permissions.forEach(perm => {
            if (!xml.includes(perm)) {
              xml = xml.replace(/<manifest[^>]*>/, `$&\\n    <uses-permission android:name="${perm}"/>`);
            }
          });
          
          fs.writeFileSync(manifestPath, xml, "utf8");
          console.log("AndroidManifest.xml configured successfully.");
          '

          # Generate app icons if icon.png is present
          if [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx capacitor-assets generate --android || echo "Icon generation complete."
          fi

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Configure Firebase Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          node -e '
          const fs = require("fs");
          const target = "android/app/google-services.json";
          const secretJson = process.env.GOOGLE_SERVICES_JSON;
          if (secretJson && secretJson.trim().length > 10) {
            fs.writeFileSync(target, secretJson.trim(), "utf8");
            console.log("Injected google-services.json from GitHub Secrets.");
          } else {
            const fallback = {
              "project_info": {
                "project_number": "100000000000",
                "project_id": "zingarena-ludo",
                "storage_bucket": "zingarena-ludo.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:100000000000:android:abcdef123456",
                    "android_client_info": {
                      "package_name": "com.zingarena.app"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [{ "current_key": "dummy_api_key_for_build" }],
                  "services": {}
                }
              ],
              "configuration_version": "1"
            };
            fs.writeFileSync(target, JSON.stringify(fallback, null, 2), "utf8");
            console.log("Created valid fallback google-services.json.");
          }
          '

      - name: Configure Gradle & Plugins
        run: |
          cp ~/.android/debug.keystore android/app/debug.keystore
          
          cd android
          chmod +x gradlew
          
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=false" >> gradle.properties
          
          node -e '
          const fs = require("fs");
          
          // 1. Root build.gradle
          let rootGradle = fs.readFileSync("build.gradle", "utf8");
          if (!rootGradle.includes("com.google.gms:google-services")) {
            rootGradle = rootGradle.replace(/dependencies\s*\{/, "$&\n        classpath \x27com.google.gms:google-services:4.4.2\x27");
          }
          if (!rootGradle.includes("org.jetbrains.kotlin:kotlin-stdlib")) {
            rootGradle += "\nallprojects {\n    configurations.all {\n        resolutionStrategy {\n            force \x27org.jetbrains.kotlin:kotlin-stdlib:1.9.24\x27\n            force \x27org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24\x27\n            force \x27org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24\x27\n        }\n    }\n}\n";
          }
          fs.writeFileSync("build.gradle", rootGradle, "utf8");
          
          // 2. App build.gradle
          let appGradle = fs.readFileSync("app/build.gradle", "utf8");
          if (!appGradle.includes("com.google.gms.google-services")) {
            appGradle += "\napply plugin: \x27com.google.gms.google-services\x27\n";
          }
          if (!appGradle.includes("signingConfigs.debug")) {
            appGradle += `
android {
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
`;
          }
          fs.writeFileSync("app/build.gradle", appGradle, "utf8");
          console.log("Gradle build files configured successfully.");
          '

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Upload ZingArena Ludo APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZingArena-Ludo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
