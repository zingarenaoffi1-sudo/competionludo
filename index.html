<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultra Ludo Pro - Main Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-wrapper">
        <div class="game-header">
            <div class="logo-text">ULTRA LUDO</div>
        </div>

        <div id="mode-selection-modal" class="modal">
            <div class="modal-content">
                <h2 style="color: #ff9900; margin-bottom: 20px;">ULTRA LUDO</h2>
                <p style="color: #ddd; margin-bottom: 20px;">Select Game Mode</p>
                <button class="ultra-roll-btn" onclick="window.location.href='local.html'" style="width: 100%; margin-bottom: 10px; background: linear-gradient(to bottom, #4CAF50, #2E7D32);">Local Offline</button>
                <button class="ultra-roll-btn" onclick="window.location.href='online.html'" style="width: 100%;">Online Multiplayer</button>
            </div>
        </div>
    </div>
</body>
</html>
