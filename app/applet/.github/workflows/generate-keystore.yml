name: Generate Permanent Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Permanent Production Keystore
        run: |
          mkdir -p keystore_output
          cd keystore_output

          # Generate 25-year permanent production key
          keytool -genkeypair \
            -alias zingarena_release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore release.keystore \
            -storepass zingarena123 \
            -keypass zingarena123 \
            -dname "CN=ZingArena, OU=MobileGames, O=ZingArena, L=NewDelhi, ST=Delhi, C=IN"

          # Convert to Base64
          base64 -w 0 release.keystore > release_keystore_base64.txt

          echo "================================================================="
          echo "           🔑 YOUR PERMANENT RELEASE KEY DETAILS                 "
          echo "================================================================="
          echo "Key Alias: zingarena_release"
          echo "Key Password: zingarena123"
          echo "Store Password: zingarena123"
          echo "-----------------------------------------------------------------"
          echo "           📋 FINGERPRINTS (COPY TO FIREBASE CONSOLE)            "
          echo "-----------------------------------------------------------------"
          keytool -list -v -keystore release.keystore -alias zingarena_release -storepass zingarena123 | grep -E "(SHA1|SHA256|MD5)"
          echo "================================================================="

      - name: Upload Keystore & Base64 as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Permanent-Release-Keystore
          path: keystore_output/
          retention-days: 30
